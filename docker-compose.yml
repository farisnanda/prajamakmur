services:
  praja-makmur-db:
    image: postgres:16
    container_name: praja-makmur-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-praja_makmur}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5436:5432"
    volumes:
      - praja-makmur-postgres:/var/lib/postgresql/data

volumes:
  praja-makmur-postgres:
